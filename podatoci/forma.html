<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <title>Chat со OpenAI API</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        #chat-container {
            width: 350px;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
        }
        #chat-messages {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 5px;
            margin-bottom: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        #chat-input {
            width: 80%;
            padding: 5px;
        }
        #send {
            width: 18%;
            padding: 5px;
        }
    </style>
</head>
<body>

<!-- Chat дел -->
<div id="chat-container" style="display:block;">
    <div id="chat-messages"></div>
    <input id="chat-input" type="text" placeholder="Напиши порака..." autocomplete="off"/>
    <button id="send">Прати</button>
</div>

<script src="script.js"></script>

</body>
</html>
