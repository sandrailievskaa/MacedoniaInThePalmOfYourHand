<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
  <input id="chat-input" type="text">
  <button id="send">></button>
<script>



  $(document).ready(function() {



    $("#send").click(function () {
      console.log("POVIK")
        sendMessageToChatGPT($("#chat-input").val())
    })


    function sendMessageToChatGPT(message) {
      console.log(message)
      $.ajax({
        url: 'https://api.openai.com/v1/chat/completions',
        type: 'POST',
        contentType: 'application/json',
        headers: {
            'Authorization': 'Bearer YOUR_API_KEY_HERE',
            'Content-Type': 'application/json'
        },
        data: JSON.stringify({
          model: "gpt-3",
          messages: [{"role": "user", "content": message}]
        }),
        success: function(response) {
          console.log(response)
          var gptMessage = response.choices[0].message.content;
          $('#chat-messages').append('<div><strong>ChatGPT:</strong> ' + gptMessage + '</div>');
        },
        error: function(xhr, status, error) {
          console.error('Error:', status, error);
          var errorMessage = JSON.parse(xhr.responseText).error.message;
          console.log('Error message:', errorMessage);
          $('#chat-messages').append('<div><strong>ChatGPT:</strong> Error communicating with the server.</div>');
        }
      });
    }
  });



</script>
</body>
</html>
